name: Build desktop installers

# Build explicitly requested revisions; never publish an untested installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-14
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Windows CPU-only inference runtime
        if: runner.os == 'Windows'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies and packager
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: python windows_setup.py
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install desktop dependencies
        run: npm ci
      - name: Check desktop persistence and backend isolation
        run: python -m unittest test_runtime_paths test_desktop_backend test_snapshot
      - name: Check desktop window security and editor persistence
        run: npm test
      - name: Build and validate desktop installer
        run: npm run dist
      - name: Exercise packaged editor, media playback, recovery and render
        run: python scripts/smoke_desktop.py
      - name: Save installers for download and testing
        uses: actions/upload-artifact@v4
        with:
          name: OtomatikEdit-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
