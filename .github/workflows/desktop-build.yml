name: Build desktop installers

# Build explicitly requested revisions; never publish an untested installer.
on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare a draft GitHub release after both installers pass validation
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-14
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Check desktop window security and editor persistence
        run: npm test
      - name: Install Windows CPU-only inference runtime
        if: runner.os == 'Windows'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies and packager
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: python windows_setup.py
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Check desktop persistence, rendering and backend isolation
        run: >-
          python -m unittest test_runtime_paths test_desktop_backend test_desktop_update
          test_snapshot test_sticker_timing test_render_encoder test_render_resources
          test_render_overlays test_render_execution test_render_graph_optimizations test_render_color test_image_layer_effects
          test_multitrack_crop
      - name: Verify preview color math and workspace geometry in Electron
        run: |
          npx --no-install electron tests/color_preview.electron.cjs
          npx --no-install electron tests/workspace_layout.electron.cjs
      - name: Verify sticker timeline geometry and preview timing in Electron
        run: npx --no-install electron tests/sticker_timing.electron.cjs
      - name: Verify imported image motion, effects, project removal and recovery in Electron
        run: npx --no-install electron tests/image_editing.electron.cjs
      - name: Verify hidden empty channels, first-item drops and safe drag cancellation in Electron
        run: npx --no-install electron tests/empty_tracks.electron.cjs
      - name: Verify native multi-clip selection, grouped editing and ripple recovery in Electron
        run: npx --no-install electron tests/timeline_selection.electron.cjs
      - name: Verify magnetic snapping, cut navigation and exact timeline trimming in Electron
        run: npx --no-install electron tests/timeline_snapping.electron.cjs
      - name: Verify timeline copy/paste shortcuts and source crop controls in Electron
        run: npx --no-install electron tests/timeline_tools.electron.cjs
      - name: Verify parallel video channels, crop composition and shared playback in Electron
        run: npx --no-install electron tests/video_tracks.electron.cjs
      - name: Verify a real installed Windows update and automatic relaunch
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: node scripts/windows_update_smoke.cjs
      - name: Require independent installed-update proof
        if: runner.os == 'Windows'
        run: node scripts/windows_update_smoke.cjs --verify-proof
      - name: Build and validate desktop installer
        run: npm run dist
      - name: Exercise packaged editor, media playback, recovery and render
        run: python scripts/smoke_desktop.py
      - name: Save installers for download and testing
        uses: actions/upload-artifact@v4
        with:
          name: OtomatikEdit-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare validated installers as a draft release
    needs: desktop
    if: ${{ inputs.prepare_release && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked metadata validation dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit
      - name: Download validated installers from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: OtomatikEdit-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify update metadata names, versions and installer checksums
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const yaml = require('js-yaml');
          const version = require('./package.json').version;
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(require('./version.json').version, version);
          async function verify(manifest, installer) {
            const metadata = yaml.load(fs.readFileSync(path.join('release-artifacts', manifest), 'utf8'));
            assert.equal(metadata.version, version, `${manifest}: wrong version`);
            assert.ok(Array.isArray(metadata.files) && metadata.files.length === 1, `${manifest}: unexpected files`);
            const entry = metadata.files[0];
            assert.equal(entry.url, installer, `${manifest}: unexpected download URL`);
            assert.equal(metadata.path, installer, `${manifest}: unexpected legacy download path`);
            const file = path.join('release-artifacts', installer);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && stat.size > 0, `${installer}: expected a regular nonempty file`);
            const hash = crypto.createHash('sha512');
            for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
            const sha512 = hash.digest('base64');
            assert.equal(entry.sha512, sha512, `${manifest}: installer checksum mismatch`);
            assert.equal(metadata.sha512, sha512, `${manifest}: legacy checksum mismatch`);
            if (entry.size !== undefined) assert.equal(entry.size, stat.size, `${manifest}: installer size mismatch`);
            console.log(`Validated ${manifest} against ${installer}`);
          }
          (async () => {
            await verify('latest.yml', `OtomatikEdit-${version}-win-x64.exe`);
            // This describes the manual DMG only. Unsigned Mac builds never
            // invoke Squirrel.Mac and intentionally do not produce a ZIP.
            await verify('latest-mac.yml', `OtomatikEdit-${version}-mac-arm64.dmg`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Create a new draft without replacing any existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_version="$(node -e '
            const version = require("./package.json").version;
            if (!/^\d+\.\d+\.\d+$/.test(version) || require("./version.json").version !== version) {
              throw new Error("Desktop and backend release versions must match.");
            }
            process.stdout.write(version);
          ')"
          release_tag="v${release_version}"
          installer_assets=(
            "release-artifacts/OtomatikEdit-${release_version}-win-x64.exe"
            "release-artifacts/OtomatikEdit-${release_version}-mac-arm64.dmg"
          )
          release_assets=("${installer_assets[@]}" "release-artifacts/latest.yml" "release-artifacts/latest-mac.yml")
          for installer in "${installer_assets[@]}"; do
            if [[ -s "${installer}.blockmap" && ! -L "${installer}.blockmap" ]]; then
              release_assets+=("${installer}.blockmap")
            fi
          done
          for asset in "${release_assets[@]}"; do
            if [[ ! -s "$asset" || -L "$asset" ]]; then
              printf 'Missing or invalid validated release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done
          if gh release view "$release_tag" --json id >/dev/null 2>&1; then
            printf 'Release %s already exists; no release or assets will be overwritten.\n' "$release_tag" >&2
            exit 1
          fi
          # --target only creates a missing tag. Refuse to attach these binaries
          # to an existing tag that resolves to a different revision.
          remote_tag="$(git ls-remote --tags origin "refs/tags/${release_tag}" "refs/tags/${release_tag}^{}")"
          if [[ -n "$remote_tag" ]]; then
            tagged_commit="$(printf '%s\n' "$remote_tag" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } { direct=$1 } END { print peeled ? peeled : direct }')"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              printf 'Tag %s does not point to this validated revision; refusing to create release.\n' "$release_tag" >&2
              exit 1
            fi
          fi
          gh release create "$release_tag" "${release_assets[@]}" \
            --draft --target "$GITHUB_SHA" \
            --title "Otomatik Edit ${release_version}" \
            --notes "Windows x64 ve macOS Apple Silicon kurulum dosyaları. Her iki platformda paket bağımlılıkları, medya oynatma, proje kurtarma, render ve kare kaydetme kontrolleri tamamlandı. Bu taslak elle incelendikten sonra yayımlanmalıdır."
          printf 'Prepared draft **%s** from validated commit `%s`. Publishing remains manual.\n' "$release_tag" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
