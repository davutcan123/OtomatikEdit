<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Terminal · Otomatik Edit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#d8e3f3;font:13px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:22px 24px 18px;border-bottom:1px solid #243247;background:linear-gradient(125deg,#111d32,#0d1625)}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:20px;margin:0 0 7px}.hint{color:#8fa4bf;font-size:12px;margin:0}.live{color:#5eead4;white-space:nowrap}.dot{display:inline-block;background:#2dd4bf;width:7px;height:7px;border-radius:50%;margin-right:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}input,select,button{font:inherit;color:inherit;border:1px solid #33445d;background:#101c30;border-radius:8px;padding:10px 12px}input[type=search]{flex:1;min-width:160px}button{cursor:pointer}button:hover{background:#203753}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}.follow{display:flex;align-items:center;gap:5px;color:#b0c1d6;font-size:12px;white-space:nowrap}input[type=checkbox]{accent-color:#38bdf8}main{overflow:auto;flex:1;min-height:0;padding:8px 0}.row{display:grid;grid-template-columns:88px 90px 1fr;gap:14px;padding:7px 24px;border-bottom:1px solid #131f30;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.row:hover{background:#111d30}.row time{color:#768eab}.source{color:#83b8ed}.message{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}.error .message{color:#fda4af}.warn .message{color:#fde68a}.success .message{color:#6ee7b7}.empty{padding:40px;text-align:center;color:#7e95b0}footer{padding:11px 24px;border-top:1px solid #243247;display:flex;justify-content:space-between;gap:20px;color:#8fa4bf;font-size:11px}#status{color:#67e8f9}@media(max-width:760px){header{padding:16px}.row{padding:7px 16px;grid-template-columns:72px 70px 1fr;gap:8px}.toolbar{gap:7px}select{max-width:130px}}
</style><script src="log-renderer.cjs" defer></script></head>
<body><header><div class="heading"><div><h1>Terminal</h1><p class="hint">Render, düzenleme ve uygulama motorunun ayrıntılı günlüğü</p></div><span class="live"><i class="dot"></i>Canlı kayıt</span></div>
<div class="toolbar"><input id="search" type="search" placeholder="Mesajlarda ara…" aria-label="Günlük mesajlarında ara"><select id="source" aria-label="Kayıt kaynağı"><option value="all">Tüm kaynaklar</option><option value="manual">Editör</option><option value="auto">Otomatik kesim</option><option value="backend">Motor</option><option value="app">Uygulama</option></select><select id="level" aria-label="Kayıt düzeyi"><option value="all">Tüm mesajlar</option><option value="error">Hatalar</option><option value="warn">Uyarılar</option></select><button id="copy" type="button">Görünenleri kopyala</button><label class="follow"><input id="follow" type="checkbox" checked>Son kaydı izle</label></div></header>
<main id="records" tabindex="0" aria-label="Günlük kayıtları"><p class="empty">Kayıtlar yükleniyor…</p></main><footer><span id="count">Bu oturumun son kayıtları</span><span id="status" role="status"></span></footer></body></html>
